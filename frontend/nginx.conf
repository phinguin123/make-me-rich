# ─────────────────────────────────────────────────────────────────────────────
# Nginx configuration for the Kiwoom Dashboard frontend container.
#
#  Responsibilities:
#    1. Serve the React SPA with correct HTML5 history fallback.
#    2. Reverse-proxy  /ws   →  backend:8000/ws   (WebSocket)
#    3. Reverse-proxy  /api/ →  backend:8000/      (HTTP REST)
#    4. Set security headers and enable gzip.
# ─────────────────────────────────────────────────────────────────────────────

upstream backend_http {
    server backend:8000;
    keepalive 32;
}

upstream backend_ws {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header X-Content-Type-Options nosniff     always;
    add_header Referrer-Policy        same-origin always;

    # ── Static assets (React SPA) ─────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for hashed build assets (Vite outputs e.g. main.abc1234.js).
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML5 history API: always serve index.html for unknown routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── WebSocket proxy  /ws → backend:8000/ws ────────────────────────────────
    location /ws {
        proxy_pass         http://backend_ws/ws;
        proxy_http_version 1.1;

        # Required for WebSocket handshake
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived WS connections open (86 400 s = 24 h).
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 10s;
    }

    # ── REST API proxy  /api/ → backend:8000/ ────────────────────────────────
    location /api/ {
        proxy_pass         http://backend_http/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # keepalive reuse

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  30s;
        proxy_send_timeout  30s;
    }
}
